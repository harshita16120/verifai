name: Deploy Demo Branch

on:
  push:
    branches:
      - main

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Dependency Security Audit (Node.js)
        run: npm audit --audit-level=high

      - name: Setup Python for Security Audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Dependency Security Audit (Python)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit || echo "::warning ::pip-audit detected potential dependency vulnerabilities."

      - name: Run Linter
        run: npm run lint

      - name: Run Production Build
        run: npm run build

      - name: Fast-Forward Merge and Push to Demo Branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin demo:demo || git branch demo
          git checkout demo
          git merge --ff-only main
          git push origin demo
